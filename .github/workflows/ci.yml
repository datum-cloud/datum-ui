name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately held at v4. This repo relies on action-setup inferring the
      # pnpm version from the root packageManager field (no version input), and
      # v6 has open regressions for exactly that -- pnpm/action-setup#225 and
      # #227 report v6 ignoring the requested version. Installing the wrong pnpm
      # here would silently change lockfile resolution and the minimumReleaseAge
      # supply-chain gate, so the bump waits until those are fixed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm trusted publishing cannot create a package through OIDC, so Release
      # would 404 on a new package. Fail the PR once a changeset would publish
      # one that is not on npm yet; warn (not fail) before bootstrap.
      - name: Public packages publishable from CI
        run: node .github/scripts/check-npm-packages.mjs

      # Glob rather than the bare directory: Node 24 treats a directory argument
      # as an entry module instead of searching it, so `node --test .github/scripts`
      # fails with MODULE_NOT_FOUND.
      - name: Release script tests
        run: node --test '.github/scripts/**/*.test.mjs'

      - run: pnpm lint

      # The published `exports` map is generated from scripts/exports-manifest.mjs.
      # Nothing else fails when package.json drifts from it, so a stale map ships
      # silently and breaks consumer deep-imports. Read-only check.
      - name: Export map in sync with manifest
        run: pnpm --filter @datum-cloud/datum-ui check:exports

      # @datum-cloud/datum-ui-tokens mirrors the datum-ui CSS as TypeScript.
      # Regenerate in memory and fail if the committed tokens.gen.ts differs,
      # so a CSS token change cannot ship without the TS tokens following it.
      - name: Tokens in sync with CSS
        run: pnpm check:tokens

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Component test/story coverage matrix
        run: pnpm --filter @datum-cloud/datum-ui check:coverage-matrix

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: datum-ui-dist
          path: packages/datum-ui/dist/
          retention-days: 7

      # Release consumes this artifact, so it must cover every public package
      # rather than a hand-maintained list: a new package would otherwise be
      # missing from the pack step. The common ancestor is packages/, so
      # downloading it to packages/ restores the package directories; the
      # glob picks up each package's dist/ while native also ships its
      # non-dist assets.
      - uses: actions/upload-artifact@v7
        with:
          name: public-packages-dist
          path: |
            packages/*/dist/
            packages/native/fonts/
            packages/native/assets/
          retention-days: 7

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: datum-ui-dist
          path: packages/datum-ui/dist/

      - run: pnpm --filter @repo/storybook build

  storybook-image:
    name: Build Storybook image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: apps/storybook/Dockerfile
          push: false
          cache-from: type=gha
