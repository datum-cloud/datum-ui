name: Release

# Release runs only after the CI workflow has completed successfully on a push
# to `main`. This gates npm publish behind green lint/typecheck/test/build
# (STRUCT-073) and lets us publish the exact artifact CI validated (STRUCT-081).
#
# The workflow is split so only the final publish job can mint an OIDC token:
#   select-mode -> version  (there are changesets: open the Version PR)
#   select-mode -> pack -> publish  (the Version PR merged: publish the plan)
# `pack` takes no publish credentials, so a compromised pack step cannot
# publish, and `version` cannot mint an OIDC token.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Default to no token scope anywhere; each job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  # A half-cancelled release can leave a version published without its tag or
  # GitHub Release. Queue instead of cancelling; a newer CI run will pick up
  # whatever remains.
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    # Only release for a successful CI run triggered by a push to main. Kept on
    # this job alone: everything else is gated by its mode output.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      plan-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history so `changeset status` can diff against the `main`
          # baseBranch when deciding the mode; a shallow detached checkout
          # errors instead. (CR-007 / STRUCT-076)
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false

      # Deliberately held at v4. This repo relies on action-setup inferring the
      # pnpm version from the root packageManager field (no version input), and
      # v6 has open regressions for exactly that -- pnpm/action-setup#225 and
      # #227 report v6 ignoring the requested version. Installing the wrong pnpm
      # here would silently change lockfile resolution and the minimumReleaseAge
      # supply-chain gate, so the bump waits until those are fixed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          # No npm registry auth is configured on purpose: publish uses OIDC
          # trusted publishing, so a cache restore of ~/.npmrc must not happen.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select release mode
        id: select
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    runs-on: ubuntu-latest
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The PR body compares against `main`, which needs the full history.
          fetch-depth: 0
          # The version action commits through the GitHub API, not git push.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PR description
        id: pr-body
        run: |
          BODY=$(.github/scripts/generate-version-pr-body.sh)
          # Only the generated release-type line decides the suffix. Changeset
          # summaries below it are contributor-authored, so grepping the whole
          # body would let a summary containing "Release Type: `major`" spoof
          # the title.
          FIRST_LINE=$(printf '%s\n' "$BODY" | head -n 1)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Determine title suffix based on bump type
          if grep -q "Release Type: \`major\`" <<< "$FIRST_LINE"; then
            echo "title-suffix=(major)" >> "$GITHUB_OUTPUT"
          elif grep -q "Release Type: \`minor\`" <<< "$FIRST_LINE"; then
            echo "title-suffix=(minor)" >> "$GITHUB_OUTPUT"
          elif grep -q "Release Type: \`patch\`" <<< "$FIRST_LINE"; then
            echo "title-suffix=(patch)" >> "$GITHUB_OUTPUT"
          else
            echo "title-suffix=" >> "$GITHUB_OUTPUT"
          fi

      # One combined Version PR: every pending changeset lands in a single pull
      # request instead of one per package.
      - name: Create version pull request
        id: version
        uses: changesets/action/version@v2
        with:
          script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages ${{ steps.pr-body.outputs.title-suffix }}"

      # Pass the body through the environment (never interpolated into the shell
      # command) so backticks/quotes in the changelog can't be executed. (BUG-107)
      - name: Update PR description
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.pr-body.outputs.body }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          gh pr edit "$PR_NUMBER" --body "$PR_BODY"

  pack:
    name: Pack release
    runs-on: ubuntu-latest
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    permissions:
      contents: read
      # Cross-run artifact download (actions/download-artifact with run-id +
      # github-token) needs actions:read. Once a permissions block is declared,
      # every unlisted scope defaults to none, so this must be explicit or the
      # download 403s. (CR-001 / STRUCT-081)
      actions: read
    outputs:
      pack-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publish the exact build CI produced and validated instead of rebuilding.
      # The artifact's common ancestor is packages/, so downloading it to
      # packages/ restores every package's build output.
      - name: Download validated build artifact
        uses: actions/download-artifact@v8
        with:
          name: public-packages-dist
          path: packages/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # pnpm pack ships whatever is on disk and never builds, so a missing
      # artifact would publish an empty package. Fail before packing.
      - name: Assert every public package has a build
        run: node .github/scripts/assert-public-dist.mjs

      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.plan-id }}

  # OIDC trusted publishing is the only npm credential here: no static npm
  # token is configured anywhere in this workflow, and setup-node has no
  # registry auth URL. npm trusts this workflow by repository + workflow
  # FILENAME, so renaming or moving release.yml silently breaks publishing
  # (the job would fail auth, it would not fall back to a token). Do not
  # rename this file.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # select-mode is a direct dependency, not just pack: Actions only exposes
    # the outputs of jobs listed in `needs`, so without it the mode output is
    # empty and this job's guard would never be true.
    needs: [select-mode, pack]
    if: needs.select-mode.outputs.mode == 'publish'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Tags and GitHub Releases are created through the API.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishes the tarballs pack produced, not the working tree, so what npm
      # receives is exactly what the assertion step inspected. Creates one tag
      # and one GitHub Release per published package.
      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-id }}
          create-github-releases: true
