packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowlist (pnpm 11 home for the former pnpm.onlyBuiltDependencies).
# Only lefthook needs its install script (git hooks); the rest are not required.
allowBuilds:
  '@swc/core': false
  core-js: false
  esbuild: false
  lefthook: true
  sharp: false
  unrs-resolver: false

# Security overrides
# Scoped entries pin vulnerable transitive dependencies to patched releases.
#
# SCOPE: these govern THIS workspace's install only (local dev, CI, tests).
# pnpm overrides are not published -- `files` is ["LICENSE","README.md","dist"]
# -- so they do not constrain what consumers resolve.
#
# They are still not "dev-only" in the sense the previous comment claimed:
# undici and dompurify DO appear in the published runtime tree, via the
# `isomorphic-dompurify` runtime dependency (-> jsdom -> undici). A CVE there is
# real consumer exposure; it just has to be fixed by bumping the dependency
# itself, because an override here will not reach them.
#
# Keep entries scoped (`pkg@range: version`), never blanket (`pkg: range`): a
# blanket pin silently caps future majors that legitimately need a newer line.
overrides:
  # Two undici copies, two separate advisory lines, both needing an entry.
  #   7.x <- ai-sdk (@ai-sdk/provider-utils -> ai), dev tree only.
  #   8.x <- jsdom 30, which is reached BOTH by the jsdom devDependency and by
  #          `isomorphic-dompurify`, a runtime dependency -- so the 8.x line is
  #          consumer-exposed (see the SCOPE note above: an override here fixes
  #          this workspace only, not what consumers resolve).
  # The 7.x selector does not match the 8.x copy, so bumping it alone leaves the
  # consumer-facing line vulnerable. Patched floors are 7.29.1 and 8.10.2; both
  # entries take the latest of their own major, never crossing it.
  "undici@>=7.0.0 <7.29.0": "7.30.0"
  "undici@>=8.0.0 <8.10.2": "8.11.2"
  # GHSA HIGH on two separate lines: <1.1.17 and >=4.0.0 <5.0.8. The previous
  # entry pinned exactly 5.0.7, which is itself inside the vulnerable range,
  # and left the 1.x copy uncovered entirely.
  "brace-expansion@>=1.0.0 <1.1.17": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.8": "5.0.12"
  # Not a CVE. Two React copies cause "Invalid hook call" at test time: the
  # Radix packages resolve their peer through @repo/shadcn (>=19.2.7 <20) and
  # bound to 19.2.7, while datum-ui and apps/storybook declare ^19.2.8. Hooks
  # then run against a different React instance than the renderer. Dedupe.
  # Workspace-local only -- consumers resolve React themselves and datum-ui's
  # own peer range is unchanged.
  "react@>=19.0.0 <19.2.8": "19.2.8"
  "react-dom@>=19.0.0 <19.2.8": "19.2.8"
  # Not a CVE. @types/leaflet-draw, @types/leaflet.fullscreen and
  # @types/leaflet.markercluster all augment the `leaflet` module. If more than
  # one @types/leaflet is resolved, the augmentations attach to one copy and the
  # build reads the other -- `Control.FullScreen`, `Draw` and friends vanish.
  # Keep it deduped to a single version.
  "@types/leaflet@>=1.9.0 <1.9.22": "1.9.22"
  # GHSA HIGH, dev tree only (storybook -> webpack -> schema-utils -> ajv).
  "fast-uri@>=3.0.0 <3.1.4": "3.1.8"
  # GHSA HIGH, via storybook/vite/tailwind.
  "postcss@>=8.0.0 <8.5.18": "8.5.26"
  # dompurify has two copies and both are under the advisory floor (>=3.4.13):
  #   3.4.8  <- monaco-editor (dev)
  #   3.4.12 <- isomorphic-dompurify (runtime) and mermaid -> streamdown (dev)
  # One selector spanning the 3.x line covers both without crossing the major.
  "dompurify@>=3.0.0 <3.4.13": "3.4.16"
  # GHSA MODERATE x5 (prototype pollution, CSS injection, two DoS); mermaid
  # arrives via streamdown, dev tree only.
  "mermaid@>=11.0.0 <11.16.1": "11.17.2"
  # GHSA MODERATE x2 (array-limit bypass, DoS via attacker-controlled isBuffer).
  # Dev tree only: storybook-builder-rsbuild -> url -> qs.
  "qs@>=6.0.0 <6.16.0": "6.16.0"
  # GHSA MODERATE path traversal. The vulnerable copy is 3.2.7, bundled by
  # storybook-builder-rsbuild; the advisory has no 3.x patch (fixed only in
  # 4.1.11), so this is the one entry that must cross a major. Dev tree only,
  # and the storybook build is verified against it -- if a future storybook
  # bumps its own mocker, drop this entry rather than widening it.
  "@vitest/mocker@>=2.1.0 <4.1.11": "4.1.11"

  # next, sharp and react-router are here only because `nuqs` (a devDependency,
  # used for one data-table adapter) declares five framework adapters as
  # optional peers, and `auto-install-peers=true` in .npmrc installs them
  # regardless. Nothing imports them -- `pnpm why next` resolves solely through
  # nuqs, no workspace manifest declares them, and no source file imports
  # `nuqs/adapters/*`. They accounted for 11 of the HIGH advisories.
  "next@>=16.0.0 <16.2.11": "16.3.6"
  "sharp@<0.35.0": "0.35.4"
  # react-router 7 cannot be fully patched: the RSC CSRF advisory
  # (>=7.12.0 <8.3.0) is fixed only in 8.3.0, outside nuqs's declared peer range
  # (^5 || ^6 || ^7). Forcing 8.3.0 emits a peer warning and nothing more --
  # strict-peer-dependencies is off and the adapter module is never loaded.
  "react-router@>=7.0.0 <8.3.0": "8.3.0"
