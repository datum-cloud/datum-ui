packages:
  - "apps/*"
  - "packages/*"

# Don't install a version until it has been public for one day (in minutes).
# Our own packages are published and consumed across repositories on the same
# day, so the delay must not hold them back.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token for a package that normally
# publishes from CI.
trustPolicy: no-downgrade
# Each version below was published without provenance after earlier releases
# of the same package had it. Exempt by exact version, so the next release of
# each package is checked again.
trustPolicyExclude:
  # Expo SDK 57, through apps/native-catalog and packages/native. Expo moved to
  # trusted publishing with its SDK 58 canaries, so every later 57.x patch reads
  # as a downgrade. Only SDK 58 releases have provenance, and @expo/cli 57 pins
  # its helpers to the 57 line (for example @expo/env ~2.4.4), so an override
  # can't reach them. Drop these when the repo moves to SDK 58.
  - '@expo/cli@57.0.34'
  - '@expo/config-plugins@57.0.13'
  - '@expo/config@57.0.11'
  - '@expo/env@2.4.4'
  - '@expo/fingerprint@0.20.16'
  - '@expo/image-utils@0.11.7'
  - '@expo/inline-modules@0.1.9'
  - '@expo/local-build-cache-provider@57.0.10'
  - '@expo/log-box@57.0.5'
  - '@expo/metro-config@57.0.14'
  - '@expo/metro-file-map@57.0.5'
  - '@expo/plist@0.8.2'
  - '@expo/prebuild-config@57.0.21'
  - '@expo/require-utils@57.0.7'
  - '@expo/router-server@57.0.15'
  - '@expo/schema-utils@57.0.3'
  - babel-preset-expo@57.0.17
  - expo-asset@57.0.21
  - expo-constants@57.0.24
  - expo-modules-autolinking@57.0.18
  - expo-modules-core@57.0.26
  - expo-modules-jsi@57.1.3
  - expo@57.0.33
  - jest-expo@57.0.6
  # Through ts-checker-rspack-plugin (^4). 4.0.1 had provenance; no later 4.x
  # release exists.
  - chokidar@4.0.3

# Moved from .npmrc: pnpm reads its settings from this file. Optional peers
# such as nuqs's framework adapters rely on it (see the overrides below).
autoInstallPeers: true

# These packages ship agent skills. The org decided none should be enabled.
permissions:
  '@tanstack/react-table':
    skills: false
  ai:
    skills: false
  tsdown:
    skills: false

# Dependencies whose install scripts may run. Only lefthook needs its script
# (git hooks); the rest were reviewed and are not required.
allowBuilds:
  '@swc/core': false
  core-js: false
  esbuild: false
  lefthook: true
  sharp: false
  unrs-resolver: false

# Security overrides
# Scoped entries pin vulnerable transitive dependencies to patched releases.
#
# SCOPE: these govern THIS workspace's install only (local dev, CI, tests).
# pnpm overrides are not published -- `files` is ["LICENSE","README.md","dist"]
# -- so they do not constrain what consumers resolve.
#
# They are still not "dev-only" in the sense the previous comment claimed:
# undici and dompurify DO appear in the published runtime tree, via the
# `isomorphic-dompurify` runtime dependency (-> jsdom -> undici). A CVE there is
# real consumer exposure; it just has to be fixed by bumping the dependency
# itself, because an override here will not reach them.
#
# Keep entries scoped (`pkg@range: version`), never blanket (`pkg: range`): a
# blanket pin silently caps future majors that legitimately need a newer line.
overrides:
  # Two undici copies, two separate advisory lines, both needing an entry.
  #   7.x <- ai-sdk (@ai-sdk/provider-utils -> ai), dev tree only.
  #   8.x <- jsdom 30, which is reached BOTH by the jsdom devDependency and by
  #          `isomorphic-dompurify`, a runtime dependency -- so the 8.x line is
  #          consumer-exposed (see the SCOPE note above: an override here fixes
  #          this workspace only, not what consumers resolve).
  # The 7.x selector does not match the 8.x copy, so bumping it alone leaves the
  # consumer-facing line vulnerable. Patched floors are 7.29.1 and 8.10.2; both
  # entries take the latest of their own major, never crossing it.
  "undici@>=7.0.0 <7.29.0": "7.30.1"
  "undici@>=8.0.0 <8.10.2": "8.12.3"
  # GHSA HIGH on two separate lines: <1.1.17 and >=4.0.0 <5.0.8. The previous
  # entry pinned exactly 5.0.7, which is itself inside the vulnerable range,
  # and left the 1.x copy uncovered entirely.
  "brace-expansion@>=1.0.0 <1.1.17": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.8": "5.0.12"
  # Not a CVE. Two React copies cause "Invalid hook call" at test time: the
  # Radix packages resolve their peer through @repo/shadcn (>=19.2.7 <20) and
  # bound to 19.2.7, while datum-ui and apps/storybook declare ^19.2.8. Hooks
  # then run against a different React instance than the renderer. Dedupe.
  # Workspace-local only -- consumers resolve React themselves and datum-ui's
  # own peer range is unchanged.
  "react@>=19.0.0 <19.2.8": "19.2.8"
  "react-dom@>=19.0.0 <19.2.8": "19.2.8"
  # Not a CVE. @types/leaflet-draw, @types/leaflet.fullscreen and
  # @types/leaflet.markercluster all augment the `leaflet` module. If more than
  # one @types/leaflet is resolved, the augmentations attach to one copy and the
  # build reads the other -- `Control.FullScreen`, `Draw` and friends vanish.
  # Keep it deduped to a single version.
  "@types/leaflet@>=1.9.0 <1.9.22": "1.9.22"
  # GHSA HIGH, dev tree only (storybook -> webpack -> schema-utils -> ajv).
  "fast-uri@>=3.0.0 <3.1.4": "3.1.9"
  # GHSA HIGH, via storybook/vite/tailwind.
  "postcss@>=8.0.0 <8.5.18": "8.5.32"
  # dompurify resolves as two copies from parents with different specs:
  #   3.4.15 <- monaco-editor (dev + peer), which pins dompurify exactly
  #   3.4.17 <- isomorphic-dompurify (runtime), already patched
  # monaco-editor's exact pin cannot move on its own, and every 3.x release from
  # 3.4.4 through 3.4.16 carries the advisory (fixed in 3.4.17). The selector
  # must therefore span the whole 3.x line up to the patch, not stop at 3.4.12.
  # One entry covers both copies without crossing the major.
  "dompurify@>=3.0.0 <3.4.17": "3.4.17"
  # GHSA MODERATE x5 (prototype pollution, CSS injection, two DoS); mermaid
  # arrives via streamdown, dev tree only.
  "mermaid@>=11.0.0 <11.16.1": "11.17.2"
  # GHSA MODERATE x2 (array-limit bypass, DoS via attacker-controlled isBuffer).
  # Dev tree only: storybook-builder-rsbuild -> url -> qs.
  "qs@>=6.0.0 <6.16.0": "6.17.1"
  # GHSA MODERATE path traversal. The vulnerable copy is 3.2.7, bundled by
  # storybook-builder-rsbuild; the advisory has no 3.x patch (fixed only in
  # 4.1.11), so this is the one entry that must cross a major. Dev tree only,
  # and the storybook build is verified against it -- if a future storybook
  # bumps its own mocker, drop this entry rather than widening it.
  "@vitest/mocker@>=2.1.0 <4.1.11": "4.1.12"

  # next, sharp and react-router are here only because `nuqs` (a devDependency,
  # used for one data-table adapter) declares five framework adapters as
  # optional peers, and `autoInstallPeers` above installs them
  # regardless. Nothing imports them -- `pnpm why next` resolves solely through
  # nuqs, no workspace manifest declares them, and no source file imports
  # `nuqs/adapters/*`. They accounted for 11 of the HIGH advisories.
  "next@>=16.0.0 <16.2.11": "16.4.5"
  "sharp@<0.35.0": "0.35.5"
  # react-router 7 cannot be fully patched: the RSC CSRF advisory
  # (>=7.12.0 <8.3.0) is fixed only in 8.3.0, outside nuqs's declared peer range
  # (^5 || ^6 || ^7). Forcing 8.3.0 emits a peer warning and nothing more --
  # strict-peer-dependencies is off and the adapter module is never loaded.
  "react-router@>=7.0.0 <8.3.0": "8.3.0"
  # GHSA CRITICAL x2 (fixed 2.1.1 and 2.1.2). Dev tree only: @repo/config ->
  # eslint-plugin-format -> oxfmt, which pins tinypool to exactly 2.1.0 and has
  # no 0.35.x release that moves it. 2.1.2 is the closest patched release to the
  # pin and stays on the 2.x line oxfmt was built against.
  "tinypool@>=2.0.0 <2.1.2": "2.2.0"
  # GHSA CRITICAL (fixed 1.11.0). Dev tree only: launch-editor (via
  # @changesets/cli) and react-devtools-core (via react-native). Both declare
  # caret 1.x ranges, so 1.11.0 sits inside what they already accept.
  "shell-quote@>=1.8.4 <1.11.0": "1.12.0"
  # GHSA HIGH + MODERATE x3 + LOW (fixed 7.3.7). Dev tree only: storybook's
  # csf-plugin and the vitest mocker both pull 7.3.6. Same minor line.
  "vite@>=7.0.0 <7.3.7": "8.3.5"
  # GHSA HIGH (fixed 4.6.6). Dev tree only: @eslint-react/shared pins 4.4.3.
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  "zod@<4": "4.6.7"
  "uuid@<11.1.1": "14.0.3"
  "katex@<0.18.2": "0.19.1"
  # GHSA HIGH + MODERATE x2 (fixed 2.14.2). Dev tree only, via @changesets/cli.
  "launch-editor@<2.14.2": "2.14.2"
  # GHSA HIGH (fixed 1.2.2). Dev tree only: tailwind, css-tree, vue compiler.
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  # GHSA MODERATE (fixed 7.1.6). Dev tree only: eslint-plugin-vue.
  "postcss-selector-parser@>=7.0.0 <7.1.6": "7.1.7"
  "minimatch@^10": "11.0.4"
  "glob@^13": "14.0.3"
